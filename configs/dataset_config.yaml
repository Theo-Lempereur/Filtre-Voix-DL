clean_preprocessing:
  # ${DRIVE_PROJECT} est résolu à l'exécution par src.dataset_builder.config
  # vers la racine du Drive partagé (G:/Mon Drive/Filtre-Voix-DL sur Windows
  # avec Drive Desktop, /content/drive/MyDrive/Filtre-Voix-DL sur Colab, etc).
  input_dir: "${DRIVE_PROJECT}/data/jules/wav"
  output_dir: "data/processed/clean_chunks"
  metadata_dir: "data/metadata"
  logs_dir: "data/logs"

  sample_rate: 16000
  mono: true
  chunk_duration_sec: 4.0

  # null = consommer tous les fichiers sources disponibles
  max_files: null
  shuffle_files: true
  random_seed: 42

  # Si false : les fichiers < 4 sec sont ignorés
  # Si true : ils sont complétés avec du silence
  pad_short_files: false

  # Loudness normalization
  normalize_rms: true
  target_rms_db: -25.0
  max_gain_db: 20.0
  peak_limit: 0.98

  # Silence / fichiers inutiles
  min_duration_sec: 4.0
  silence_threshold_db: -50.0
  min_non_silent_ratio: 0.05

  # Performance
  max_workers: 8
  skip_existing: true

  # Accepted input formats
  allowed_extensions:
    - ".wav"
    - ".mp3"
    - ".flac"
    - ".ogg"
    - ".m4a"
    - ".aac"



noise_preprocessing:
  input_dir: "${DRIVE_PROJECT}/data/jules/noise/free-sound"
  output_dir: "data/processed/noise_chunks"
  metadata_dir: "data/metadata"
  logs_dir: "data/logs"

  sample_rate: 16000
  mono: true
  chunk_duration_sec: 4.0

  max_files: null
  shuffle_files: true
  random_seed: 42

  # Repeating short noise files is acceptable for background noise material.
  repeat_short_files: true

  min_duration_sec: 0.5
  silence_threshold_db: -60.0
  min_non_silent_ratio: 0.03

  peak_limit: 0.98

  max_workers: 8
  skip_existing: true

  allowed_extensions:
    - ".wav"
    - ".mp3"
    - ".flac"
    - ".ogg"
    - ".m4a"
    - ".aac"



generation:
  clean_dir: "data/processed/clean_chunks"
  noise_dir: "data/processed/noise_chunks"

  output_dir: "data/processed/generated"
  metadata_dir: "data/metadata"
  logs_dir: "data/logs"

  sample_rate: 16000
  duration_sec: 4.0

  num_train_samples: 64000
  num_val_samples: 8000
  num_test_samples: 8000

  snr_min_db: -5.0
  snr_max_db: 20.0

  min_clean_rms_db: -45.0
  min_noise_rms_db: -60.0

  peak_limit: 0.98
  avoid_clipping: true
  apply_gain_to_target: true

  batch_size: 64
  max_workers: 8

  seed: 42
  deterministic: true
  skip_existing: true

  save_noise: false

  apply_clean_augment: true
  apply_noise_augment: false

  apply_post_noisy_augment: true
  post_noisy_augment_probability: 0.2

  template_mix:
  - name: Classic
    count: 48000
    generation:
      snr_min_db: -5.0
      snr_max_db: 20.0
      apply_clean_augment: false
      apply_noise_augment: false
      apply_post_noisy_augment: false
      post_noisy_augment_probability: 0.0
    augmentations:
      p_gain: 0.0
      p_eq: 0.0
      p_compression: 0.0
      p_saturation: 0.0
      p_clipping: 0.0
      p_phone_filter: 0.0
      p_reverb: 0.0
      p_codec: 0.0
      p_dropout: 0.0
      p_quantization: 0.0
  - name: Microphone mode
    count: 10667
    generation:
      snr_min_db: -3.0
      snr_max_db: 18.0
      apply_clean_augment: true
      apply_noise_augment: false
      apply_post_noisy_augment: true
      post_noisy_augment_probability: 0.35
    augmentations:
      p_gain: 0.3
      p_eq: 0.45
      p_compression: 0.75
      p_saturation: 0.25
      p_clipping: 0.05
      p_phone_filter: 0.45
      p_reverb: 0.16
      p_codec: 0.22
      p_dropout: 0.08
      p_quantization: 0.12
      compressor_threshold_min_db: -34.0
      compressor_threshold_max_db: -16.0
      compressor_ratio_min: 2.5
      compressor_ratio_max: 6.0
  - name: Very noisy
    count: 21333
    generation:
      snr_min_db: -10.0
      snr_max_db: 12.0
      apply_clean_augment: false
      apply_noise_augment: false
      apply_post_noisy_augment: false
      post_noisy_augment_probability: 0.0
    augmentations:
      p_gain: 0.0
      p_eq: 0.0
      p_compression: 0.0
      p_saturation: 0.0
      p_clipping: 0.0
      p_phone_filter: 0.0
      p_reverb: 0.0
      p_codec: 0.0
      p_dropout: 0.0
      p_quantization: 0.0

  # Partitionne les chunks sources en 3 sous-pools disjoints (train/val/test)
  # avant tirage, pour éviter qu'un même chunk clean/noise serve à la fois
  # à l'entraînement et à l'évaluation. Ratios = (train, val, test).
  enforce_split_isolation: true
  split_ratios: [0.8, 0.1, 0.1]

  allowed_extensions:
    - ".wav"



augmentations:
  enabled: true

  p_gain: 0.3
  p_eq: 0.35
  p_compression: 0.55
  p_saturation: 0.18
  p_clipping: 0.05
  p_phone_filter: 0.2
  p_reverb: 0.16
  p_codec: 0.12
  p_dropout: 0.04
  p_quantization: 0.08

  compressor_threshold_min_db: -32.0
  compressor_threshold_max_db: -14.0
  compressor_ratio_min: 2.0
  compressor_ratio_max: 5.0

  saturation_drive_min_db: 2.0
  saturation_drive_max_db: 10.0

  phone_highpass_min_hz: 250.0
  phone_lowpass_max_hz: 3800.0
